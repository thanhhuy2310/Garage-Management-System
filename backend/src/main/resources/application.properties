spring.application.name=garage-management-backend
server.port=8080

# SQL Server - sửa lại theo máy của bạn hoặc dùng biến môi trường.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=QuanLyGaraOTo;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:YourStrongPasswordHere}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Vì database đã có schema SQL riêng, giai đoạn đầu không để Hibernate tự tạo bảng.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

spring.jackson.time-zone=Asia/Ho_Chi_Minh
