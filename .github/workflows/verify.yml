name: Verify Garage
on:
  push:
    branches: [integration]
  pull_request:
    branches: [integration]
  workflow_dispatch:
    inputs:
      verify_sql:
        description: Run on the dedicated SQL verification runner
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and run backend tests
        working-directory: backend
        run: bash mvnw -B verify
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, type-check and build
        working-directory: frontend
        run: |
          npm ci
          npx --no-install tsc --noEmit
          npm run build
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true
      - name: Run Flutter tests
        working-directory: mobile
        run: |
          flutter pub get --enforce-lockfile
          flutter test --no-pub
  sql:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_sql && github.ref == 'refs/heads/integration'
    runs-on: [self-hosted, Windows, garage-sql-verification]
    environment: garage-verification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify real SQL workflows
        working-directory: backend
        shell: pwsh
        env:
          DB_URL: ${{ secrets.VERIFY_DB_URL }}
          DB_USERNAME: ${{ secrets.VERIFY_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.VERIFY_DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.VERIFY_JWT_SECRET }}
          RUN_SQLSERVER_IT: 'true'
        run: |
          if ($env:DB_URL -notmatch '(?i);databaseName=QuanLyGaraOTo_Verify_\d{8}(;|$)') { throw 'Expected an isolated SQL Server verification database.' }
          ./mvnw.cmd -B '-Dtest=RepairBillingSqlServerIT,InsuranceWorkflowSqlServerIT,AppointmentsSqlServerIT,QuotationsSqlServerIT' test
